[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opengraph-sdk"
version = "0.1.0"
description = "Official Python SDK for the OpenGraph developer API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["knowledge-graph", "llm", "rag", "opengraph"]
authors = [{ name = "OpenGraph" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/anthropics/opengraph"
Documentation = "https://opengraph.example/api-docs"
Issues = "https://github.com/anthropics/opengraph/issues"

[tool.hatch.build.targets.wheel]
packages = ["opengraph_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
