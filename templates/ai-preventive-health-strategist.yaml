slug: ai-preventive-health-strategist
name: AI Preventive Health Strategist
description: >
  Predicts diseases before symptoms — uses lifestyle, biometric,
  genomic, and claims data to stratify risk and recommend personalised
  screening, behavioural, and medication interventions upstream.
category: healthcare
icon: HeartPulse
domain:
  domain_name: Preventive & Population Health
  domain_display_name: AI Preventive Health Strategist
  organization_name: Population Health & Preventive Medicine
