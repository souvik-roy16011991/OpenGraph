    frameworks (The Points Guy), last-minute vs advance booking
    elasticity, cancellation and change-fee economics
  tool_focus_examples: |
    fare-search APIs (Amadeus Self-Service, Sabre Bargain Finder Max,
    Kiwi.com Tequila, Duffel, Skyscanner Affiliate), hotel APIs (Expedia
    EPS Rapid, HotelBeds, Booking.com Connectivity), price-prediction
    (Hopper Fair, Google Flights Insights), loyalty-currency trackers
    (AwardWallet, Seats.aero), alert services (Going / Scott's Cheap Flights)
