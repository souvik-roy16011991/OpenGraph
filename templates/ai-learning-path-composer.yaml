slug: ai-learning-path-composer
name: AI Learning Path Composer
description: >
  Builds personalised L&D curricula — maps each employee's current
  skills to target-role skills and assembles an adaptive learning
  path from internal content, vendor courses, and mentorship so
  careers progress on evidence, not guesswork.
category: people
icon: GraduationCap
domain:
