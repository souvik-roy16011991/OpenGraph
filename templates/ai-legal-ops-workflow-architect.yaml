slug: ai-legal-ops-workflow-architect
name: AI Legal Ops Workflow Architect
description: >
  Automates matter intake, outside-counsel triage, and spend
  management — turns email-driven legal requests into triaged,
  SLA'd, budget-tracked matters so legal runs like an ops team,
  not a black box.
category: legal
icon: Workflow
domain:
  domain_name: Legal Operations & Matter Management
  domain_display_name: AI Legal Ops Workflow Architect
  organization_name: Legal Operations Function
  knowledge_focus_examples: |
    CLOC core competency model, matter-lifecycle stages (intake,
