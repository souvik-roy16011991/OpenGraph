    (fixed, capped, collar, risk-collar), LPM (legal project
    management) fundamentals, outside-counsel guidelines (OCGs),
    matter-budget variance analysis, legal-KPI scorecards
  tool_focus_examples: |
    matter / e-billing (SimpleLegal, Brightflag, Onit, TyMetrix360,
