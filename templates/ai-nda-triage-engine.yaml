slug: ai-nda-triage-engine
name: AI NDA Triage Engine
description: >
  Sorts, classifies, and auto-approves standard NDAs — lets
  commercial teams sign mutual and inbound NDAs in minutes when
  they match the playbook, escalating only genuinely non-standard
  asks to counsel.
category: legal
icon: FileCheck
domain:
  domain_name: NDA Automation & Self-Service
  domain_display_name: AI NDA Triage Engine
  organization_name: Commercial Legal — NDA Program
