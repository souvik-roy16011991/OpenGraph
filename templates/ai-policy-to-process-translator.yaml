slug: ai-policy-to-process-translator
name: AI Policy-to-Process Translator
description: >
  Converts policies into executable workflows — ensures operational
  compliance through automation by turning policy PDFs into BPMN
  processes, decision rules, and workflow tasks mapped to each control.
category: backoffice
icon: ListChecks
domain:
  domain_name: Policy Operationalisation
  domain_display_name: AI Policy-to-Process Translator
  organization_name: Compliance Operations — Policy Automation
  knowledge_focus_examples: |
    policy-to-control mapping frameworks (NIST CSF, ISO 27001 Annex
