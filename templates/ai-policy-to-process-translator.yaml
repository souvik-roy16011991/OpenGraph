    authoring lifecycle (draft, attest, certify, retire), policy-
    exception workflows, control-testing methodology (design vs
    operating effectiveness), BPMN gateway / task mapping conventions,
    attestation cadence design, readability / plain-English rewriting
  tool_focus_examples: |
    policy-management platforms (NAVEX PolicyTech, MetricStream Policy
    & Document Mgmt, Hyperproof, Vanta, Drata, Tugboat Logic, Strike
