    FX netting and multilateral netting, money-market-fund limits,
    repo / reverse-repo funding ladders, commercial paper programs,
    in-house banking models, payment-factory architectures
  tool_focus_examples: |
    treasury management systems (Kyriba, GTreasury, ION Treasury,
