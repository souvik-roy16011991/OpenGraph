slug: ai-liquidity-optimizer
name: AI Liquidity Optimizer
description: >
  Ensures optimal cash flow at all times — balances inflows, outflows,
  intraday liquidity, and funding sources dynamically so treasury
  neither over-funds idle balances nor breaches minimum buffers.
category: finance
icon: DollarSign
domain:
  domain_name: Treasury & Liquidity Management
  domain_display_name: AI Liquidity Optimizer
  organization_name: Corporate Treasury Operations
  knowledge_focus_examples: |
    liquidity coverage ratio (LCR) and NSFR mechanics, cash-sweep
