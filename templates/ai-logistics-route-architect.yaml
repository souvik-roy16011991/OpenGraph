slug: ai-logistics-route-architect
name: AI Logistics Route Architect
description: >
  Designs optimal delivery routes — reduces time, fuel, and CO2 by
  solving multi-stop VRP with time windows, capacity, driver hours,
  and urban-access restrictions baked in.
category: operations
icon: Route
domain:
  domain_name: Route Optimisation & Fleet Routing
  domain_display_name: AI Logistics Route Architect
  organization_name: Logistics & Fleet Operations
  knowledge_focus_examples: |
    vehicle routing problem variants (VRPTW, CVRP, PDP, DARP), hours-
    of-service rules (FMCSA HOS, EU AETR), low-emission-zone and
    congestion-charging rules (ULEZ, LEZ), last-mile densification
    heuristics, strategic / tactical / operational routing tiers,
    dwell-time modelling, cold-chain routing constraints
  tool_focus_examples: |
    route-optimisation engines (Google OR-Tools, Ortec, Descartes,
    Routific, OptimoRoute, Paragon), TMS platforms (Oracle TMS,
    MercuryGate, SAP TM), telematics + ELD (Samsara, Motive, Geotab),
    mapping APIs (HERE, Google Maps Platform, Mapbox), last-mile
    dispatch (Bringg, Onfleet), proof-of-delivery mobile apps
