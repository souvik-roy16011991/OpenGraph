    mixed-logit models, psychographic segmentation (VALS, Big-5),
    behavioural-economics bias catalogs, synthetic-population
    generation techniques, counterfactual what-if simulation,
    identity resolution across sessions
  tool_focus_examples: |
    agent-based simulation frameworks (NetLogo, AnyLogic, MESA,
