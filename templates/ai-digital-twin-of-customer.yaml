slug: ai-digital-twin-of-customer
name: AI Digital Twin of Customer
description: >
  Creates virtual customer models — simulates behaviour and preferences
  under pricing, product, and offer variations so teams pressure-test
  decisions against synthetic customers before rolling them out.
category: customer
icon: Users
domain:
  domain_name: Customer Digital Twins & Simulation
  domain_display_name: AI Digital Twin of Customer
  organization_name: Consumer Insights — Simulation Lab
