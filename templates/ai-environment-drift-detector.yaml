    drift, schema drift), Terraform state-locking and drift-detection
    semantics, GitOps reconciliation loops (Flux, Argo CD), policy-
    as-code guardrails (OPA / Rego, Sentinel), dev-prod parity
    principles (12-factor), manual-change governance (break-glass
    workflows), environment-config parity testing
  tool_focus_examples: |
