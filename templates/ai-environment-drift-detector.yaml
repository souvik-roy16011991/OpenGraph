slug: ai-environment-drift-detector
name: AI Environment Drift Detector
description: >
  Detects unintended infra changes — maintains consistency across dev,
  staging, and prod by continuously diffing declared state against
  actual, flagging out-of-band changes and rolling back when safe.
category: engineering
icon: GitCompareArrows
domain:
  domain_name: Infrastructure Drift & Config Parity
  domain_display_name: AI Environment Drift Detector
  organization_name: Platform Engineering — Infra Governance
