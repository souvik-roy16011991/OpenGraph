  Manages all tax deadlines intelligently — prevents penalties via
  proactive scheduling, escalation ladders, and document-readiness
  checks across every statutory obligation for every entity.
category: tax
icon: CalendarClock
domain:
  domain_name: Tax Compliance Calendar
  domain_display_name: AI Compliance Timeline Orchestrator
