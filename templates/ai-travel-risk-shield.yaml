slug: ai-travel-risk-shield
name: AI Travel Risk Shield
description: >
  Protects travelers from global risks — monitors safety, health,
  political, and natural-disaster threats in real time and provides
  proactive rerouting, evacuation, and assistance triggers.
category: travel
icon: ShieldCheck
domain:
  domain_name: Travel Risk Management & Duty of Care
  domain_display_name: AI Travel Risk Shield
  organization_name: Corporate Travel Security & Duty of Care
  knowledge_focus_examples: |
    duty-of-care / ISO 31030 travel risk-management standards,
    GRMS / ITSM incident classifications, OSAC / FCDO / US State
