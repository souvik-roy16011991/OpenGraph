    health alerts, natural-disaster early-warning (PTWC tsunami, USGS
    earthquake), kidnap-and-ransom / K&R protocols, medical-evacuation
    triggers, traveller-tracking consent rules (GDPR, state privacy)
  tool_focus_examples: |
    travel-risk platforms (International SOS TravelTracker, Crisis24,
