# ---------------------------------------------------------------------------
# Render Blueprint — KB Knowledge Graph Engine
# ---------------------------------------------------------------------------
# Three stateless Docker services (all share the same image):
#
#   1. opengraph-backend        FastAPI (APP_MODE=api). Stateless — build
#                               state lives in Neon, so WEB_CONCURRENCY>1
#                               and multiple instances are safe.
#   2. opengraph-build-worker   Async worker (APP_MODE=worker). Polls Neon
#                               via SELECT ... FOR UPDATE SKIP LOCKED,
#                               runs one build per process. Scale by
#                               adding instances, not concurrency.
#   3. opengraph-frontend       Next.js 15 production server. NEXT_PUBLIC_*
#                               values are baked into the client bundle at
#                               build time via --build-arg.
#
# -- First-deploy secret checklist -------------------------------------------
# In the Render dashboard set these with `sync: false` before the first deploy.
# Auth is first-party JWT — no third-party provider.
#
#   Backend only:
#     OPENROUTER_API_KEY
#     DATABASE_URL                 (Neon pooled connection string)
#     MEMGRAPH_URI / _USERNAME / _PASSWORD
#     QDRANT_URL / QDRANT_API_KEY
#     SUPABASE_S3_ACCESS_KEY_ID    (Supabase dashboard → Project Settings →
#     SUPABASE_S3_SECRET_ACCESS_KEY Storage → S3 Connection → Generate)
#     UPSTASH_REDIS_REST_URL / _TOKEN
#     JWT_SECRET                   (generate with `python -c "import secrets;
#                                   print(secrets.token_urlsafe(48))"`).
#                                   Rotating this invalidates every live token.
#
# Protected routes return 503 until JWT_SECRET is set. See DEPLOY.md.
# ---------------------------------------------------------------------------

services:
  # =========================================================================
  # Backend — FastAPI + background build threads
  # =========================================================================
  - type: web
    name: opengraph-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    plan: starter           # Free is 512 MB; starter (1 GB) is needed when
                            # sentence-transformers loads alongside the graph.

    envVars:
      # --- OpenRouter (LLM + remote embeddings) -------------------------
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: qwen/qwen3-235b-a22b
      - key: LLM_TEMPERATURE
        value: "0.1"
      - key: LLM_MAX_TOKENS
        value: "4096"
      # Default embedding model for new workspaces. Each workspace can
      # override this via the graph-config UI (`/api/v1/config/graph` →
      # embeddings.model); this value is only the fallback when unset.
      - key: EMBEDDING_MODEL
        value: qwen/qwen3-embedding-8b
      # Force the deterministic TF-IDF fallback instead of remote embeddings.
      # "1" is useful for offline tests; leave "0" in production.
      - key: KB_FORCE_TFIDF
        value: "0"
      # Optional comma-separated allowlist. Empty = expose full OpenRouter
      # catalog via /api/v1/llm/models. Set to e.g.
      # "anthropic/claude-3-7-sonnet,openai/gpt-4o-mini" to cap cost/quality.
      - key: OPENROUTER_ALLOWED_MODELS
        value: ""

      # --- Memgraph (primary graph store) -------------------------------
      - key: MEMGRAPH_URI
        sync: false
      - key: MEMGRAPH_USERNAME
        sync: false
      - key: MEMGRAPH_PASSWORD
        sync: false
      - key: MEMGRAPH_DATABASE
        value: memgraph

      # --- Qdrant (primary vector store; one collection per workspace) --
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      # Legacy singleton name; per-workspace code uses kb-{ws_id_short}.
      - key: QDRANT_COLLECTION_NAME
        value: kb-knowledge-graph
      # 1M-scale mode: when non-empty, every tenant shares this single
      # Qdrant collection and reads/writes are filtered by a
      # ``workspace_id`` payload field. Leave empty to keep the per-
      # workspace collection layout (which hits Qdrant Cloud's per-account
      # collection cap around ~1000 workspaces). If you set it, set the
      # **same** value on the worker service below — mismatched values
      # mean builds write to one collection and queries read from another.
      - key: QDRANT_SHARED_COLLECTION
        value: ""

      # --- Neon Postgres (users + workspaces + history + audit log) -----
      - key: DATABASE_URL
        sync: false
      # Connection-pool tuning per FastAPI worker. Defaults are safe for
      # Neon Launch (~900 max direct conns). At 10 instances × 2 uvicorn
      # workers × 12 conns = 240, well under the cap. Raise if the Neon
      # dashboard shows pool-wait saturation.
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "10"
      - key: DB_POOL_RECYCLE
        value: "1800"        # 30 min — stays under Neon's idle kill
      - key: DB_POOL_TIMEOUT
        value: "30"

      # --- Caching (per-process, bounded) -------------------------------
      # sub→User LRU. Bump for high-uniqueness-user traffic.
      - key: USER_CACHE_TTL_SECONDS
        value: "300"
      - key: USER_CACHE_MAX
        value: "8192"
      # prefix→ApiKeyContext LRU. Same TTL semantics — a revoked key
      # stops working within this window (revoke also pushes a local
      # invalidation).
      - key: API_KEY_CACHE_TTL_SECONDS
        value: "300"
      - key: API_KEY_CACHE_MAX
        value: "8192"

      # --- Rate limiting (fixed-window on Upstash) ----------------------
      # Fail-open: when Upstash is unreachable we allow the request and
      # log a warning. Flip to "1" only if strict enforcement during
      # cache outage is worth user-facing 5xx.
      - key: RATE_LIMIT_FAIL_CLOSED
        value: "0"
      - key: RATE_LIMIT_VERSION
        value: "v1"

      # --- Multi-tenant Cypher guard ------------------------------------
      # Asserts every write/read Cypher binds workspace_id before the
      # driver sees it. Disable only to debug a specific false positive
      # and re-enable before shipping.
      - key: GRAPH_FILTER_GUARD
        value: "1"

      # --- Upload request concurrency -----------------------------------
      # Per-request cap on concurrent per-file blob-PUT + dedup + INSERT
      # tasks inside upload_routes. 8 saturates Vercel Blob without
      # exhausting the Neon pool (DB_POOL_SIZE=2, MAX_OVERFLOW=10).
      # Raise with the DB pool if you bump it.
      - key: UPLOAD_CONCURRENCY
        value: "8"

      # --- Vision-OCR ingestion guardrails ------------------------------
      # Must match the opengraph-build-worker values — the backend
      # enforces queue cap and daily ceiling at enqueue time; the worker
      # enforces the OpenRouter rate limit at OCR time.
      - key: USER_PARSE_QUEUE_CAP
        value: "50"
      - key: USER_DAILY_PARSE_USD
        value: "20.00"

      # --- Supabase Storage (durable KB file storage, per workspace) ----
      # S3-compatible API used for write/list/delete; reads are public URL
      # GETs (bucket must be marked public). Must match values set on the
      # opengraph-build-worker service below — both services read + write
      # the same bucket. See src/infra/blob_loader.py for the adapter.
      - key: SUPABASE_S3_ENDPOINT
        value: https://eaxceyittlbldulejccn.storage.supabase.co/storage/v1/s3
      - key: SUPABASE_S3_REGION
        value: ap-northeast-1
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: opengraph-kb
      - key: SUPABASE_PUBLIC_URL_BASE
        value: https://eaxceyittlbldulejccn.supabase.co/storage/v1/object/public

      # --- Upstash Redis (JWKS cache, cross-link cache, catalog cache) --
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      # --- Auth (JWT HS256) ---------------------------------------------
      # Protected routes 401 without a valid Bearer JWT and 503 if JWT_SECRET
      # is missing. The secret signs tokens minted by /auth/signup + /auth/login;
      # rotating it invalidates every live session at once.
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_MINUTES
        value: "43200"           # 30 days
      - key: JWT_ISSUER
        value: kb-graph-engine
      - key: PASSWORD_MIN_LENGTH
        value: "8"

      # --- GitHub OAuth (optional; leave unset to disable the button) ---
      # Register a PROD OAuth app at https://github.com/settings/applications/new
      # Homepage: https://opengraph.tech
      # Callback: https://opengraph-backend.onrender.com/api/v1/auth/github/callback
      # Paste client id + secret into the Render dashboard (sync: false).
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_REDIRECT_URI
        value: https://opengraph-backend.onrender.com/api/v1/auth/github/callback
      - key: FRONTEND_URL
        value: https://opengraph.tech

      # --- Guardrails ---------------------------------------------------
      # Caps each user at this many workspaces — prevents template-
      # instantiation abuse.
      - key: MAX_WORKSPACES_PER_USER
        value: "25"

      # --- Domain seed (kb-config) --------------------------------------
      # Pin the disk seed path so a renamed / moved checkout can't
      # confuse the loader. The Dockerfile copies the repo to /app, so
      # /app/kb-config always exists. If you deploy the worker from a
      # different image or without kb-config/, the code falls back to
      # a synthesized DomainProfile — fine for running, useless for
      # operator introspection, so prefer keeping the disk seed in place.
      - key: KB_CONFIG_PATH
        value: /app/kb-config

      # --- CORS --------------------------------------------------------
      # Hard-coded to each full origin (scheme + host) the frontend is reachable
      # from. `fromService` with `property: host` has been observed returning
      # the service *name* (`opengraph-frontend`) instead of the hostname on
      # Docker blueprints, which breaks every preflight because browsers send
      # the full `Origin: https://<host>` header — so keep these literal.
      #
      # EVERY distinct host the frontend can be served from MUST be listed,
      # because browsers exact-match the Origin header. Missing the `www.`
      # subdomain is the classic cause of "my sign-up form just fails silently"
      # — the apex works, www doesn't, and the preflight 400 isn't user-visible
      # unless you open DevTools Network.
      - key: CORS_ALLOW_ORIGINS
        value: https://opengraph.tech,https://www.opengraph.tech,https://opengraph-frontend.onrender.com,www.opengraph.tech

      # Optional regex allowlist in addition to the exact list above. Set to
      # e.g. `^https://([a-z0-9-]+\.)?opengraph\.tech$` to let ANY subdomain of
      # opengraph.tech through without needing a redeploy when you add
      # app.opengraph.tech, staging.opengraph.tech, etc. Leave empty if you
      # prefer strict exact-matching.
      - key: CORS_ALLOW_ORIGIN_REGEX
        value: ^https://([a-z0-9-]+\.)?opengraph\.tech$

      # --- Process mode -------------------------------------------------
      # src/entrypoint.py inspects APP_MODE and starts uvicorn (api) or the
      # build-worker loop (worker). WEB_CONCURRENCY controls the number of
      # uvicorn processes per instance; safe to raise now that build state
      # lives in Neon.
      - key: APP_MODE
        value: api
      - key: WEB_CONCURRENCY
        value: "2"

      # --- Misc --------------------------------------------------------
      - key: KMP_DUPLICATE_LIB_OK
        value: "TRUE"
      - key: PYTHONUNBUFFERED
        value: "1"

  # =========================================================================
  # Build worker — claims + runs builds from the Neon-backed queue
  # =========================================================================
  # Same Docker image as opengraph-backend; entrypoint branches on APP_MODE.
  # Scale by increasing instance count (one build per process invariant —
  # the graph_config/kb_config module caches are cache_clear()ed per build
  # and would race if concurrent). All env vars mirror the backend so the
  # worker can reach Memgraph, Qdrant, Blob, Upstash, and Neon.
  - type: worker
    name: opengraph-build-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    plan: starter
    envVars:
      # --- OpenRouter ---------------------------------------------------
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: qwen/qwen3-235b-a22b
      - key: LLM_TEMPERATURE
        value: "0.1"
      - key: LLM_MAX_TOKENS
        value: "4096"
      - key: EMBEDDING_MODEL
        value: qwen/qwen3-embedding-8b
      - key: KB_FORCE_TFIDF
        value: "0"
      - key: OPENROUTER_ALLOWED_MODELS
        value: ""
      # --- Memgraph -----------------------------------------------------
      - key: MEMGRAPH_URI
        sync: false
      - key: MEMGRAPH_USERNAME
        sync: false
      - key: MEMGRAPH_PASSWORD
        sync: false
      - key: MEMGRAPH_DATABASE
        value: memgraph
      # --- Qdrant -------------------------------------------------------
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION_NAME
        value: kb-knowledge-graph
      # IMPORTANT: must match the backend's QDRANT_SHARED_COLLECTION value
      # exactly. Backend reads; worker writes — if these diverge, writes
      # land in one collection and queries read from another.
      - key: QDRANT_SHARED_COLLECTION
        value: ""
      # --- Neon (required — the queue lives here) -----------------------
      - key: DATABASE_URL
        sync: false
      # Same pool defaults as the backend. Workers only run one build at a
      # time (module-level cache invariant), so a very small pool is fine.
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "10"
      - key: DB_POOL_RECYCLE
        value: "1800"
      - key: DB_POOL_TIMEOUT
        value: "30"
      # --- Supabase Storage ---------------------------------------------
      # Mirror of the backend block — both services write into the same
      # bucket. If you rotate the S3 credential in Supabase, update both.
      - key: SUPABASE_S3_ENDPOINT
        value: https://eaxceyittlbldulejccn.storage.supabase.co/storage/v1/s3
      - key: SUPABASE_S3_REGION
        value: ap-northeast-1
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: opengraph-kb
      - key: SUPABASE_PUBLIC_URL_BASE
        value: https://eaxceyittlbldulejccn.supabase.co/storage/v1/object/public
      # --- Upstash Redis ------------------------------------------------
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # --- Auth (workers don't mint tokens, but some helpers import it) -
      - key: JWT_SECRET
        sync: false
      # --- Multi-tenant Cypher guard (same semantics as backend) --------
      - key: GRAPH_FILTER_GUARD
        value: "1"
      # --- Domain seed (kb-config) --------------------------------------
      # Pin this so a moved/renamed checkout can't derail builds — the
      # zombie-worker bug we hit in local dev traced to an un-set
      # KB_CONFIG_PATH combined with a stale __file__ location. In the
      # Docker image /app/kb-config always exists.
      - key: KB_CONFIG_PATH
        value: /app/kb-config
      # --- Build heartbeat (diff-only + liveness-only updates) ----------
      # Default 10s balances operator visibility against write load on
      # build_jobs. At 500 concurrent builds this is already batched by
      # the worker to only write when the snapshot actually changed.
      - key: BUILD_HEARTBEAT_INTERVAL_S
        value: "10"

      # --- Parse (vision OCR) concurrency -------------------------------
      # Per-process cap on concurrent vision-OCR parse jobs claimed
      # from parse_jobs. Each in-flight parse holds one PyMuPDF doc in
      # memory (~50-300 MB peak); 6 concurrent × 150 MB avg ≈ 1 GB
      # plus soffice scratch, which fits starter (2 GB RAM) with
      # headroom. Raise to 8-10 on standard plan (4 GB).
      #
      # Scale horizontally: add another `type: worker` service in this
      # file with the same image + envs — SELECT FOR UPDATE SKIP LOCKED
      # makes multi-worker claims contention-free. One worker parses
      # ~60 pages/minute; four workers = ~240 pages/minute total.
      - key: PARSE_CONCURRENCY
        value: "6"

      # Per-user minute budget against OpenRouter's vision model. Stops
      # one user's 200-doc burst from starving other users of OCR
      # capacity. 120 rpm = 2 qps per user — comfortable for a single
      # batch (3 parses concurrent × ~2 pages/sec each = 6 req/sec
      # already over the limit, so pages serialise cleanly). Lower for
      # stricter fairness, set to 0 to disable.
      - key: VISION_RPM_PER_USER
        value: "120"

      # Per-user daily USD ceiling on document_parse debits. Prevents a
      # runaway burst from turning into a surprise bill. Breach returns
      # 402 on the NEXT enqueue; in-flight jobs run to completion.
      - key: USER_DAILY_PARSE_USD
        value: "20.00"

      # Max queued-or-running parse jobs per user. The 51st enqueue
      # returns 402 with reason=parse_queue_cap_exceeded. The user can
      # resume as the queue drains.
      - key: USER_PARSE_QUEUE_CAP
        value: "50"

      # --- Process mode -------------------------------------------------
      - key: APP_MODE
        value: worker
      # --- Misc --------------------------------------------------------
      - key: KMP_DUPLICATE_LIB_OK
        value: "TRUE"
      - key: PYTHONUNBUFFERED
        value: "1"

  # =========================================================================
  # Frontend — Next.js 15 App Router
  # =========================================================================
  - type: web
    name: opengraph-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    # `/` redirects to `/sign-in` via middleware. Hitting the public sign-in
    # page directly gives Render a clean 200 (vs. 307) for the health probe.
    healthCheckPath: /sign-in
    autoDeploy: true
    plan: starter

    # Next's `--build-arg` path — these bake into the client bundle at
    # `npm run build`. Render passes envVars as build args automatically
    # when dockerContext is set.
    #
    # These are hard-coded to the backend's full URL (scheme + host).
    # `fromService` with `property: host` was observed returning the service
    # *name* (`opengraph-backend`) instead of the hostname on Docker
    # blueprints, leading the client bundle to fetch a relative path and get
    # back HTML. Keep these literal; update if the backend is renamed or
    # moved to a custom domain.
    envVars:
      - key: NEXT_PUBLIC_API_BASE
        value: https://opengraph-backend.onrender.com
      - key: BACKEND_URL
        value: https://opengraph-backend.onrender.com
      - key: NODE_ENV
        value: production
      # Auth is first-party JWT; the browser stores the token in localStorage
      # + a non-HttpOnly `auth_token` cookie. No third-party env vars needed.
