# ---------------------------------------------------------------------------
# Render Blueprint — KB Knowledge Graph Engine
# ---------------------------------------------------------------------------
# Two stateless Docker services:
#
#   1. kb-backend   FastAPI (uvicorn, 1 worker — build jobs keep in-memory
#                   state, scaling workers would split that state). All
#                   runtime artefacts live in cloud stores (Memgraph,
#                   Qdrant, Vercel Blob, Neon, Upstash) — no Render disk.
#   2. kb-frontend  Next.js 15 production server. NEXT_PUBLIC_* values are
#                   baked into the client bundle at build time via --build-arg.
#
# -- First-deploy secret checklist -------------------------------------------
# In the Render dashboard set these with `sync: false` before the first deploy.
# Each is tagged with which service needs it.
#
#   Backend only:
#     OPENROUTER_API_KEY
#     DATABASE_URL                 (Neon pooled connection string)
#     MEMGRAPH_URI / _USERNAME / _PASSWORD
#     QDRANT_URL / QDRANT_API_KEY
#     BLOB_READ_WRITE_TOKEN
#     UPSTASH_REDIS_REST_URL / _TOKEN
#     NEON_AUTH_SECRET_SERVER_KEY
#
#   Frontend only:
#     NEON_AUTH_SECRET_SERVER_KEY  (server-side Stack SDK)
#
#   Shared (set identical values on both services):
#     NEON_AUTH_BASE_URL           (also exposed as NEXT_PUBLIC_NEON_AUTH_BASE_URL
#                                   so the browser SDK reaches the tenant)
#     NEON_AUTH_PROJECT_ID         (also exposed as NEXT_PUBLIC_NEON_AUTH_PROJECT_ID)
#     NEXT_PUBLIC_NEON_AUTH_PUBLISHABLE_CLIENT_KEY   (frontend only)
#
# Neon Auth is REQUIRED. Protected routes 503 until the env vars above are
# wired. See DEPLOY.md for the per-environment setup.
# ---------------------------------------------------------------------------

services:
  # =========================================================================
  # Backend — FastAPI + background build threads
  # =========================================================================
  - type: web
    name: kb-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    plan: starter           # Free is 512 MB; starter (1 GB) is needed when
                            # sentence-transformers loads alongside the graph.

    envVars:
      # --- OpenRouter (LLM + remote embeddings) -------------------------
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: qwen/qwen3-235b-a22b
      - key: LLM_TEMPERATURE
        value: "0.1"
      - key: LLM_MAX_TOKENS
        value: "4096"
      - key: EMBEDDING_MODEL
        value: qwen/qwen3-embedding-8b
      - key: KB_FORCE_TFIDF
        value: "0"
      # Optional comma-separated allowlist. Empty = expose full OpenRouter
      # catalog via /api/v1/llm/models. Set to e.g.
      # "anthropic/claude-3-7-sonnet,openai/gpt-4o-mini" to cap cost/quality.
      - key: OPENROUTER_ALLOWED_MODELS
        value: ""

      # --- Memgraph (primary graph store) -------------------------------
      - key: MEMGRAPH_URI
        sync: false
      - key: MEMGRAPH_USERNAME
        sync: false
      - key: MEMGRAPH_PASSWORD
        sync: false
      - key: MEMGRAPH_DATABASE
        value: memgraph

      # --- Qdrant (primary vector store; one collection per workspace) --
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      # Legacy singleton name; per-workspace code uses kb-{ws_id_short}.
      - key: QDRANT_COLLECTION_NAME
        value: kb-knowledge-graph

      # --- Neon Postgres (users + workspaces + history + audit log) -----
      - key: DATABASE_URL
        sync: false

      # --- Vercel Blob (durable KB file storage, per workspace) ---------
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: BLOB_STORE_PATH
        value: v0-it-support-automation-blob/kb-config

      # --- Upstash Redis (JWKS cache, cross-link cache, catalog cache) --
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      # --- Neon Auth ---------------------------------------------------
      # Protected routes 401 without a valid Bearer JWT and 503 if any of
      # these are missing. Defaults for issuer / JWKS / audience derive from
      # NEON_AUTH_BASE_URL + NEON_AUTH_PROJECT_ID, so you typically only set
      # the four below.
      - key: NEON_AUTH_BASE_URL
        sync: false
      - key: NEON_AUTH_PROJECT_ID
        sync: false
      - key: NEON_AUTH_SECRET_SERVER_KEY
        sync: false
      # Optional overrides (default to NEON_AUTH_BASE_URL/.well-known/jwks.json,
      # NEON_AUTH_BASE_URL as issuer, NEON_AUTH_PROJECT_ID as audience):
      - key: NEON_AUTH_JWKS_URL
        sync: false
      - key: NEON_AUTH_ISSUER
        sync: false
      - key: NEON_AUTH_AUDIENCE
        sync: false

      # --- Guardrails ---------------------------------------------------
      # Caps each user at this many workspaces — prevents template-
      # instantiation abuse.
      - key: MAX_WORKSPACES_PER_USER
        value: "25"

      # --- CORS --------------------------------------------------------
      # Point this at the frontend host once Render issues it. fromService
      # resolves to the live frontend URL so the backend exact-matches the
      # origin (required for Authorization headers + cookies).
      - key: CORS_ALLOW_ORIGINS
        fromService:
          type: web
          name: kb-frontend
          property: host

      # --- Misc --------------------------------------------------------
      - key: KMP_DUPLICATE_LIB_OK
        value: "TRUE"
      - key: PYTHONUNBUFFERED
        value: "1"

  # =========================================================================
  # Frontend — Next.js 15 App Router
  # =========================================================================
  - type: web
    name: kb-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    autoDeploy: true
    plan: starter

    # Next's `--build-arg` path — these bake into the client bundle at
    # `npm run build`. Render passes envVars as build args automatically
    # when dockerContext is set.
    envVars:
      - key: NEXT_PUBLIC_API_BASE
        fromService:
          type: web
          name: kb-backend
          property: host     # e.g. https://kb-backend-xxxx.onrender.com
      - key: BACKEND_URL
        fromService:
          type: web
          name: kb-backend
          property: host
      - key: NODE_ENV
        value: production

      # --- Neon Auth client SDK ----------------------------------------
      # NEXT_PUBLIC_* values freeze into the client bundle at build time and
      # point the @stackframe/stack SDK at the Neon Auth tenant. Use the
      # same project id / base URL on backend + frontend.
      - key: NEON_AUTH_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_NEON_AUTH_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_NEON_AUTH_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_NEON_AUTH_PUBLISHABLE_CLIENT_KEY
        sync: false
      - key: NEON_AUTH_SECRET_SERVER_KEY
        sync: false
